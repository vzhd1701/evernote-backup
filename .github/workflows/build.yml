name: build

on:
  workflow_call:
    inputs:
      dev:
        description: 'Build a dev snapshot: stamp a .dev.<short sha> version into the binaries and name them "dev"'
        type: boolean
        default: false
    outputs:
      version:
        description: 'Version the binaries were built with'
        value: ${{ jobs.build_python.outputs.version }}

env:
  BUILD_PYTHON_VERSION: 3.14
  PACKAGE_NAME: evernote-backup
  MODULE_NAME: evernote_backup

jobs:
  build_python:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get version
        id: get_version
        run: |
          APP_VERSION=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' ${{ env.MODULE_NAME }}/version.py)
          if [ -z "$APP_VERSION" ]; then
            echo "Cannot parse version!" >&2
            exit 1
          fi
          if [ "${{ inputs.dev }}" = "true" ]; then
            APP_VERSION="$APP_VERSION.dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Export requirements
        run: uv pip compile pyproject.toml -q --universal --no-annotate --no-header -o requirements.txt

      - name: Get Git commit timestamp
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build project for distribution
        run: uv build
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Save release python requirements
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_reqs
          path: requirements.txt

      - name: Save release python packages
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_python
          path: dist

  build_binaries:
    needs: build_python
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.build_python.outputs.version }}
      # Dev binaries get a fixed name so the pre-release download URLs never change.
      # The exact version is stamped into the binary itself instead.
      VERSION_LABEL: ${{ inputs.dev && 'dev' || needs.build_python.outputs.version }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            OS_CODE: macos_intel
            OS_CODE_BASE: macos
          - os: macos-15
            OS_CODE: macos
            OS_CODE_BASE: macos
          - os: ubuntu-latest
            OS_CODE: linux
            OS_CODE_BASE: linux
          - os: ubuntu-24.04-arm
            OS_CODE: linux_arm
            OS_CODE_BASE: linux
          - os: windows-latest
            OS_CODE: win
            OS_CODE_BASE: win
          - os: windows-11-arm
            OS_CODE: win_arm
            OS_CODE_BASE: win

    steps:
      - uses: actions/checkout@v7

      - name: Load release python requirements
        uses: actions/download-artifact@v8
        with:
          name: release_dist_reqs

      - name: Set up Python ${{ env.BUILD_PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Stamp dev version into the binary
        if: ${{ inputs.dev }}
        shell: bash
        run: |
          python - ${{ env.MODULE_NAME }}/version.py "$APP_VERSION" <<'PY'
          import pathlib
          import re
          import sys

          path, version = pathlib.Path(sys.argv[1]), sys.argv[2]

          stamped, count = re.subn(
              r'^__version__ = "[^"]*"$',
              f'__version__ = "{version}"',
              path.read_text(encoding="utf-8"),
              flags=re.MULTILINE,
          )

          if count != 1:
              sys.exit(f"Cannot stamp version in {path}")

          path.write_text(stamped, encoding="utf-8")
          PY

      - name: Build with pyinstaller
        run: pyinstaller ${{ env.PACKAGE_NAME }}.spec

      - name: Make directory for bins
        run: mkdir dist_bin

      - name: Pack up binary for macos arm64
        if: matrix.OS_CODE == 'macos'
        run: zip -q -j dist_bin/bin_${{ env.MODULE_NAME }}_${{ env.VERSION_LABEL }}_${{ matrix.OS_CODE_BASE }}_arm64.zip ./dist/${{ env.PACKAGE_NAME }}

      - name: Pack up binary for macos x64
        if: matrix.OS_CODE == 'macos_intel'
        run: zip -q -j dist_bin/bin_${{ env.MODULE_NAME }}_${{ env.VERSION_LABEL }}_${{ matrix.OS_CODE_BASE }}_x64.zip ./dist/${{ env.PACKAGE_NAME }}

      - name: Pack up binary for linux
        if: matrix.OS_CODE == 'linux'
        run: tar -zcvf dist_bin/bin_${{ env.MODULE_NAME }}_${{ env.VERSION_LABEL }}_${{ matrix.OS_CODE_BASE }}_x64.tar.gz -C ./dist ${{ env.PACKAGE_NAME }}

      - name: Pack up binary for linux arm64
        if: matrix.OS_CODE == 'linux_arm'
        run: tar -zcvf dist_bin/bin_${{ env.MODULE_NAME }}_${{ env.VERSION_LABEL }}_${{ matrix.OS_CODE_BASE }}_arm64.tar.gz -C ./dist ${{ env.PACKAGE_NAME }}

      - name: Pack up binary for windows
        if: matrix.OS_CODE == 'win'
        run: |
          choco install zip
          zip -q -j dist_bin/bin_${{ env.MODULE_NAME }}_${{ env.VERSION_LABEL }}_${{ matrix.OS_CODE_BASE }}_x64.zip ./dist/${{ env.PACKAGE_NAME }}.exe

      - name: Pack up binary for windows arm64
        if: matrix.OS_CODE == 'win_arm'
        run: |
          choco install zip
          zip -q -j dist_bin/bin_${{ env.MODULE_NAME }}_${{ env.VERSION_LABEL }}_${{ matrix.OS_CODE_BASE }}_arm64.zip ./dist/${{ env.PACKAGE_NAME }}.exe

      - name: Save release binaries for ${{ matrix.OS_CODE }}
        uses: actions/upload-artifact@v7
        with:
          name: release_dist_bin_${{ matrix.OS_CODE }}
          path: dist_bin
