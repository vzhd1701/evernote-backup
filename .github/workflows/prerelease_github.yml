name: prerelease_github

on:
  workflow_dispatch:

concurrency:
  group: prerelease_github
  cancel-in-progress: true

env:
  PRERELEASE_TAG: continuous

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      dev: true

  prerelease:
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Compose release notes
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          LATEST_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv run --frozen python - <<'PY' > release_notes.md
          import datetime
          import os

          import keepachangelog

          changelog = keepachangelog.to_dict("CHANGELOG.md", show_unreleased=True)
          unreleased = changelog.pop("unreleased", {})
          last_release = next(iter(changelog), None)

          built_on = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          commit_sha = os.environ["COMMIT_SHA"]

          print(
              f"Built from `{os.environ['REF_NAME']}` at"
              f" [`{commit_sha[:7]}`]({os.environ['COMMIT_URL']}) on {built_on}."
              f" Reports version `{os.environ['BUILD_VERSION']}`."
          )
          print()
          print(
              "> **Development build, not a stable release.** For everyday use grab the"
              f" [latest release]({os.environ['LATEST_URL']})."
          )
          print()

          since = f" since {last_release}" if last_release else ""
          sections = [
              (name, items)
              for name, items in unreleased.items()
              if name != "metadata" and isinstance(items, list) and items
          ]

          if not sections:
              print(f"No changes recorded in the changelog{since}.")
          else:
              print(f"## Changes{since}")
              for name, items in sections:
                  print()
                  print(f"### {name.capitalize()}")
                  print()
                  for item in items:
                      print(f"- {item}")
          PY

      - name: Load release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release_dist_bin_*
          merge-multiple: true
          path: dist

      - name: Move ${{ env.PRERELEASE_TAG }} tag to current commit
        run: |
          git tag -f "$PRERELEASE_TAG"
          git push -f origin "refs/tags/$PRERELEASE_TAG"

      - name: Update pre-release
        uses: ncipollo/release-action@v1
        with:
          name: Development build (${{ needs.build.outputs.version }})
          bodyFile: release_notes.md
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.PRERELEASE_TAG }}
          commit: ${{ github.sha }}
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
