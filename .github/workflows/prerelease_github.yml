name: prerelease_github

on:
  workflow_dispatch:

concurrency:
  group: prerelease_github
  cancel-in-progress: true

env:
  PRERELEASE_TAG: continuous

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      dev: true

  prerelease:
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract unreleased changes
        uses: ffurrer2/extract-release-notes@v3
        with:
          prerelease: true
          release_notes_file: unreleased.md

      - name: Compose release notes
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          LATEST_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          last_release=$(grep -m1 -oP '^## \[\K[0-9][^]]*' CHANGELOG.md || true)
          since=${last_release:+ since $last_release}
          {
            echo "Built from \`$REF_NAME\` at [\`${COMMIT_SHA::7}\`]($COMMIT_URL) on $(date -u +%F). Reports version \`$BUILD_VERSION\`."
            echo
            echo "> **Development build, not a stable release.** For everyday use grab the [latest release]($LATEST_URL)."
            echo
            if grep -q '^- ' unreleased.md; then
              echo "## Changes$since"
              echo
              cat unreleased.md
            else
              echo "No changes recorded in the changelog$since."
            fi
          } > release_notes.md

      - name: Load release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release_dist_bin_*
          merge-multiple: true
          path: dist

      - name: Move ${{ env.PRERELEASE_TAG }} tag to current commit
        run: |
          git tag -f "$PRERELEASE_TAG"
          git push -f origin "refs/tags/$PRERELEASE_TAG"

      - name: Update pre-release
        uses: ncipollo/release-action@v1
        with:
          name: Development build (${{ needs.build.outputs.version }})
          bodyFile: release_notes.md
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.PRERELEASE_TAG }}
          commit: ${{ github.sha }}
          prerelease: true
          makeLatest: false
          allowUpdates: true
          removeArtifacts: true
