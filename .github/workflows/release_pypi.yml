name: release_pypi

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

env:
  BUILD_PYTHON_VERSION: 3.10
  PACKAGE_NAME: evernote-backup

jobs:
  publish_pypi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.BUILD_PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.BUILD_PYTHON_VERSION }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v9

      - name: Get Git commit timestamp
        run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build project for distribution
        run: uv build
        env:
          SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

  publish_tap:
    needs: [ publish_pypi ]
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v8
        with:
          token: ${{ secrets.BREW_BUMP_TOKEN }}
          formula: ${{ env.PACKAGE_NAME }}
