[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "evernote-backup"
version = "1.14.0"
description = "Backup & export all Evernote notes and notebooks."
authors = [{ name = "vzhd1701", email = "vzhd1701@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = [
    "evernote",
    "yinxiang",
    "backup",
    "export",
    "enex",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "xmltodict==1.0.4",
    "click==8.4.2",
    "click-option-group==0.5.9",
    "requests-oauthlib==2.0.0",
    "thrift==0.21.0",
    "evernote-plus==1.28.1.dev2",
    "requests-sse==0.5.3",
    "pyjwt==2.13.0",
    "pycryptodome==3.23.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "keyring==25.7.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
]
license-files = ["LICENSE"]

[project.urls]
repository = "https://github.com/vzhd1701/evernote-backup"
changelog = "https://github.com/vzhd1701/evernote-backup/blob/master/CHANGELOG.md"
issues = "https://github.com/vzhd1701/evernote-backup/issues"

[project.scripts]
evernote-backup = "evernote_backup.cli:main"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "requests-mock",
]
dev = [
    "keepachangelog==2.0.0",
    "pre-commit",
    "ruff",
    "rumdl",
    "ty",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
exclude = [
    "evernote_client_api_tokenized.py",
]
select = [
    # Complexity
    #"PL",   # pylint
    #"C90",  # maccabe

    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    ##"COM",  # flake8-commas
    ##"D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle
    #"ERA",  # flake8-eradicate
    "EXE",  # flake8-executable
    "F",    # pyflakes
    ##"FBT",  # flake8-boolean-trap
    "FLY",  # pyflint
    ##"FURB", # refurb
    ##"G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    ##"N",    # pep8-naming
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    ##"RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff
    "S",    # flake8-bandit
    ##"SIM",  # flake8-simpify
    ##"SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T100", # flake8-debugger
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020
]
ignore = [
    "B904",     # raise from
    "DTZ901",   # timezone on datetime.max
    "E501",     # Line too long
    "PERF203",  # try inside loop
    "PT006",    # parametrize type
    "PT011",    # broad pytest catch
    "S301",     # unpickling from database
    "TRY003",   # long exception messages
    "TRY301",   # abstract raise
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S", "PL"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = ["tests"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.run]
omit = ["*/tests/*", "evernote_backup/evernote_client_api_tokenized.py"]

[tool.mypy]
files = "evernote_backup"

disallow_untyped_defs = true
#disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "evernote_backup.evernote_client_api_tokenized"
ignore_errors = true

[[tool.mypy.overrides]]
module = "evernote_backup.cli"
disable_error_code = ["misc"]

[tool.rumdl]
disable = ["MD013", "MD014"]
